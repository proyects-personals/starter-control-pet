name: Lint Code

on:
  push:
    branches: [develop, main]

  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Lint Report
        if: always()
        run: |
          echo "## Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint executed" >> $GITHUB_STEP_SUMMARY